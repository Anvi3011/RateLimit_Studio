services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server","--appendonly","yes"]
    volumes: [redis_data:/data]
    networks: [internal]
    healthcheck: {test: ["CMD","redis-cli","ping"], interval: 5s, timeout: 3s, retries: 10}
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:4-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    networks: [internal]
    healthcheck: {test: ["CMD","rabbitmq-diagnostics","-q","ping"], interval: 10s, timeout: 5s, retries: 10}
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Set RABBITMQ_USER in .env}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/%2F
      ADMIN_TOKEN: ${ADMIN_TOKEN:-${ADMIN_SECRET:-${ADMIN_KEY:-${ADMIN_PASSWORD:-}}}}
      FAULTS_ENABLED: ${FAULTS_ENABLED:-false}
      RATE_LIMIT_FAIL_MODE: ${RATE_LIMIT_FAIL_MODE:-closed}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
      OUTBOX_CAPACITY: ${OUTBOX_CAPACITY:-5000}
    depends_on:
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      publisher: {condition: service_started}
    networks: [internal]
    healthcheck: {test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health',timeout=2)"], interval: 15s, timeout: 4s, retries: 5}
    restart: unless-stopped
  worker:
    build: ./worker
    environment:
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Set RABBITMQ_USER in .env}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/%2F
    depends_on:
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    networks: [internal]
    healthcheck: {test: ["CMD","python","health.py"], interval: 10s, timeout: 3s, retries: 3}
    restart: unless-stopped
  publisher:
    build: ./worker
    command: ["python","publisher.py"]
    environment:
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Set RABBITMQ_USER in .env}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/%2F
      OUTBOX_CAPACITY: ${OUTBOX_CAPACITY:-5000}
    depends_on:
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    networks: [internal]
    healthcheck: {test: ["CMD","python","-c","import os,redis; r=redis.Redis.from_url(os.getenv('REDIS_URL'),socket_connect_timeout=1); assert r.ttl('ratelimit:publisher:last_seen') > 0"], interval: 15s, timeout: 4s, retries: 3, start_period: 15s}
    restart: unless-stopped
  frontend:
    build: ./frontend
    depends_on:
      backend: {condition: service_healthy}
    networks: [internal]
    restart: unless-stopped
  locust:
    profiles: [benchmarks]
    build: ./benchmarks
    volumes: ["./benchmarks/reports:/reports"]
    networks: [internal]
    command: ["-f","locustfile.py","--headless","-u","20","-r","5","-t","15s","--host","http://nginx","--csv","/reports/run"]
  nginx:
    image: nginx:1.27-alpine
    ports: ["${HTTP_PORT:-8080}:80"]
    volumes: ["./deployment/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [frontend]
    networks: [internal, edge]
    restart: unless-stopped
  nginx-tls:
    image: nginx:1.27-alpine
    profiles: [tls]
    ports: ["80:80","443:443"]
    volumes:
      - ./deployment/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:-./deployment/tls}:/etc/nginx/tls:ro
    depends_on: [frontend]
    networks: [internal, edge]
    restart: unless-stopped
  e2e:
    profiles: [e2e]
    build:
      context: ./frontend
      dockerfile: Dockerfile.e2e
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:-${ADMIN_SECRET:-${ADMIN_KEY:-${ADMIN_PASSWORD:-}}}}
      PLAYWRIGHT_BASE_URL: http://nginx
    volumes: ["./frontend/test-results:/work/test-results"]
    depends_on: [backend, frontend, nginx]
    networks: [internal]
networks:
  internal:
    internal: true
  edge:
    driver: bridge

volumes:
  redis_data:
  rabbitmq_data:
