limit_req_zone $binary_remote_addr zone=admin_control:10m rate=10r/s;
server {
 listen 80;
 server_name _;
 server_tokens off;
 client_max_body_size 64k;
 resolver 127.0.0.11 valid=5s ipv6=off;
 set $frontend_upstream http://frontend:80;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 location ~ ^/api/(config|faults|metrics|benchmarks|auth)(/|$) { limit_req zone=admin_control burst=10 nodelay; limit_req_status 429; proxy_pass $frontend_upstream; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
 location / { proxy_pass $frontend_upstream; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
}
